apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Namespace guardrails owned by the platform, kept apart so app charts can't grant themselves access
  sourceRepos:
    - git@github.com:tomasghilino/secure-eks-gitops-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: staging
    - server: https://kubernetes.default.svc
      namespace: production
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
