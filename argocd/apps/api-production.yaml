apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-production
  namespace: argocd
spec:
  project: segp
  source:
    repoURL: git@github.com:tomasghilino/secure-eks-gitops-platform.git
    targetRevision: dev
    path: charts/api
    helm:
      releaseName: api
      valueFiles:
        - ../../environments/production/api.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # the database hooks fail until external secrets has copied the credentials, so a fresh environment needs a few attempts
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
