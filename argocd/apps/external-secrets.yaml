apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # before the baseline apps, which create SecretStores and ExternalSecrets
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: external-secrets
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.12.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/external-secrets/values.yaml
    - repoURL: git@github.com:tomasghilino/secure-eks-gitops-platform.git
      targetRevision: dev
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.35
    syncOptions:
      - CreateNamespace=true
      # the CRDs are too big for the annotation that client-side apply writes
      - ServerSideApply=true
