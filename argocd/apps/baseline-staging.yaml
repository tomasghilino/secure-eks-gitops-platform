apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baseline-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: baseline
  source:
    repoURL: git@github.com:tomasghilino/secure-eks-gitops-platform.git
    targetRevision: dev
    path: charts/baseline
    helm:
      releaseName: baseline
      valueFiles:
        - ../../environments/staging/baseline.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
