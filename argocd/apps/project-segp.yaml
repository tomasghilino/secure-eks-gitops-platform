apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: segp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Workloads of the secure EKS GitOps platform
  sourceRepos:
    - git@github.com:tomasghilino/secure-eks-gitops-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: staging
    - server: https://kubernetes.default.svc
      namespace: production
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: NetworkPolicy
