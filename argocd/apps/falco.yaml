apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  annotations:
    # after the monitoring stack, which installs the ServiceMonitor and PrometheusRule CRDs
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: runtime-security
  sources:
    - repoURL: https://falcosecurity.github.io/charts
      chart: falco
      targetRevision: 9.2.0
      helm:
        releaseName: falco
        valueFiles:
          - $values/falco/values.yaml
    - repoURL: git@github.com:tomasghilino/secure-eks-gitops-platform.git
      targetRevision: dev
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        # falco reads /proc, /etc and the container runtime socket of the node through host paths
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: v1.35
    syncOptions:
      - CreateNamespace=true
