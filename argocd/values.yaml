# installed by scripts/kind-up.sh, which pins the chart version
global:
  image:
    # digest pinned after cosign verified it was signed by the argoproj/argo-cd release workflow
    tag: v3.5.4@sha256:49dff79439bb38b1b942b19a113fe1fec7e6b6c671ddf9fe6a4a7c46bde0b77b

dex:
  enabled: false

notifications:
  enabled: false

redis:
  image:
    tag: 8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763

configs:
  cm:
    # the root app waits for each sync wave of child apps to be healthy before the next one; argo cd
    # stopped judging app health in 1.8, so without this every wave would count as done immediately
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
