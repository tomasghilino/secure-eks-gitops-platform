# the only manifest applied by hand on the production eks cluster: kubectl apply -f argocd/bootstrap-production.yaml
# same as bootstrap.yaml, except the root app leaves out staging and the in-cluster postgres
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Argo CD configuration managed from Git
  sourceRepos:
    - git@github.com:tomasghilino/secure-eks-gitops-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
    - group: argoproj.io
      kind: Application
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: git@github.com:tomasghilino/secure-eks-gitops-platform.git
    targetRevision: dev
    path: argocd/apps
    directory:
      # staging has its own cluster, and production uses rds instead of the in-cluster postgres
      exclude: "{*-staging.yaml,postgres-production.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
