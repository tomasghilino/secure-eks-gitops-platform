# the only manifest applied by hand on the production eks cluster: kubectl apply -f argocd/bootstrap-production.yaml
# the root app deploys every app in argocd/apps except staging's, which run on their own cluster
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Argo CD configuration managed from Git
  sourceRepos:
    - git@github.com:tomasghilino/secure-eks-gitops-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
    - group: argoproj.io
      kind: Application
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: git@github.com:tomasghilino/secure-eks-gitops-platform.git
    targetRevision: dev
    path: argocd/apps
    directory:
      exclude: "*-staging.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
