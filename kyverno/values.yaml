admissionController:
  # the policies fail closed, so with one replica a node loss (or a spot interruption) blocks every new pod in
  # staging and production until kyverno is back; three replicas spread over the nodes, and the budget keeps
  # one running while a node is drained
  replicas: 3
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
