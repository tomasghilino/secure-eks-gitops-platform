name: ci

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

env:
  # trivy releases were hijacked in march 2026, so this digest was pinned only after cosign verified
  # it was signed by the aquasecurity/trivy release workflow
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --no-banner --log-opts=HEAD .

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/src" -w /src
          semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
          semgrep scan --config p/default --config p/github-actions --metrics=off --error

  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trivy dependencies
        run: >-
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE"
          fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --table-mode detailed app

  charts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install helm
        run: |
          curl -fsSLo helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum --check
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: lint charts
        run: |
          helm lint charts/api --values environments/staging/api.yaml
          helm lint charts/api --values environments/production/api.yaml
          helm lint charts/postgres
          helm lint charts/baseline --namespace staging --values environments/staging/baseline.yaml
          helm lint charts/baseline --namespace production --values environments/production/baseline.yaml
      - name: render charts
        run: |
          mkdir rendered
          helm template api charts/api --values environments/staging/api.yaml > rendered/api-staging.yaml
          helm template api charts/api --values environments/production/api.yaml > rendered/api-production.yaml
          helm template postgres charts/postgres > rendered/postgres.yaml
          helm template baseline charts/baseline --namespace staging --values environments/staging/baseline.yaml > rendered/baseline-staging.yaml
          helm template baseline charts/baseline --namespace production --values environments/production/baseline.yaml > rendered/baseline-production.yaml
      - name: trivy config
        run: >-
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE"
          config --severity HIGH,CRITICAL --exit-code 1 --table-mode detailed rendered
      # the same policies the cluster enforces, so a violation fails here instead of at deploy time
      # one run per environment: the cli panics when two inputs hold objects with the same name
      - name: kyverno policies
        env:
          KYVERNO_CLI: reg.kyverno.io/kyverno/kyverno-cli:v1.19.1@sha256:ced7b2be0b04250cabfe695f15307f69eb715fe23234816388af4f3812915b2a
        run: |
          helm template baseline charts/baseline --namespace staging --show-only templates/kyverno-policies.yaml > rendered/kyverno-policies.yaml
          docker run --rm -v "$PWD:/work" -w /work "$KYVERNO_CLI" apply rendered/kyverno-policies.yaml --resource rendered/api-staging.yaml --resource rendered/postgres.yaml
          docker run --rm -v "$PWD:/work" -w /work "$KYVERNO_CLI" apply rendered/kyverno-policies.yaml --resource rendered/api-production.yaml --resource rendered/postgres.yaml

  image:
    needs: [test, secrets, sast, deps, charts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: segp-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t "$IMAGE" app
      - run: docker save -o image.tar "$IMAGE"
      - name: trivy image vulnerabilities
        run: >-
          docker run --rm -v "$PWD:/work" -w /work -v "$RUNNER_TEMP/trivy:/cache" "$TRIVY_IMAGE"
          image --cache-dir /cache --input image.tar
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --table-mode detailed
      - name: trivy image secrets
        run: >-
          docker run --rm -v "$PWD:/work" -w /work -v "$RUNNER_TEMP/trivy:/cache" "$TRIVY_IMAGE"
          image --cache-dir /cache --input image.tar
          --scanners secret --exit-code 1 --table-mode detailed
      - name: sbom
        run: >-
          docker run --rm -v "$PWD:/work" -w /work -v "$RUNNER_TEMP/trivy:/cache" "$TRIVY_IMAGE"
          image --cache-dir /cache --input image.tar
          --format cyclonedx --output sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
