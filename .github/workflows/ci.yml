name: ci

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

env:
  # trivy releases were hijacked in march 2026, so this digest was pinned only after cosign verified
  # it was signed by the aquasecurity/trivy release workflow
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --no-banner --log-opts=HEAD .

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/src" -w /src
          semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
          semgrep scan --config p/default --config p/github-actions --metrics=off --error

  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trivy dependencies
        run: >-
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE"
          fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --table-mode detailed app

  charts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install helm
        run: |
          curl -fsSLo helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum --check
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: lint charts
        run: |
          helm lint charts/api --values environments/staging/api.yaml
          helm lint charts/api --values environments/production/api.yaml
          helm lint charts/postgres
          helm lint charts/baseline --namespace staging --values environments/staging/baseline.yaml
          helm lint charts/baseline --namespace production --values environments/production/baseline.yaml
      - name: render charts
        run: |
          mkdir rendered
          helm template api charts/api --values environments/staging/api.yaml > rendered/api-staging.yaml
          helm template api charts/api --values environments/production/api.yaml > rendered/api-production.yaml
          helm template postgres charts/postgres > rendered/postgres.yaml
          helm template baseline charts/baseline --namespace staging --values environments/staging/baseline.yaml > rendered/baseline-staging.yaml
          helm template baseline charts/baseline --namespace production --values environments/production/baseline.yaml > rendered/baseline-production.yaml
      - name: trivy config
        run: >-
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE"
          config --severity HIGH,CRITICAL --exit-code 1 --table-mode detailed rendered
      # the same policies the cluster enforces, so a violation fails here instead of at deploy time
      # one run per environment: the cli panics when two inputs hold objects with the same name
      - name: kyverno policies
        env:
          KYVERNO_CLI: reg.kyverno.io/kyverno/kyverno-cli:v1.19.1@sha256:ced7b2be0b04250cabfe695f15307f69eb715fe23234816388af4f3812915b2a
        run: |
          helm template baseline charts/baseline --namespace staging --show-only templates/kyverno-policies.yaml > rendered/kyverno-policies.yaml
          docker run --rm -v "$PWD:/work" -w /work "$KYVERNO_CLI" apply rendered/kyverno-policies.yaml --resource rendered/api-staging.yaml --resource rendered/postgres.yaml
          docker run --rm -v "$PWD:/work" -w /work "$KYVERNO_CLI" apply rendered/kyverno-policies.yaml --resource rendered/api-production.yaml --resource rendered/postgres.yaml
      # an alert that never fires is worse than none, so the rules have unit tests like the code
      - name: alert rules
        env:
          # the same prometheus image the cluster runs; it publishes no signature, so it is pinned by digest
          PROMETHEUS_IMAGE: quay.io/prometheus/prometheus:v3.15.0-distroless@sha256:b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
        run: |
          helm template api charts/api --namespace staging --values environments/staging/api.yaml \
            --show-only templates/prometheusrule.yaml | awk '/^spec:/{f=1;next} f{sub(/^  /,"");print}' > rendered/api-rules.yaml
          docker run --rm -v "$PWD:/work" -w /work --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" check rules rendered/api-rules.yaml
          docker run --rm -v "$PWD:/work" -w /work --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" test rules tests/alerts/api.test.yaml

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # none of these publish signatures, so they are pinned by digest
      TERRAFORM_IMAGE: hashicorp/terraform:1.16.5@sha256:c7926feace05d0f7e73542842bf3945924e955a1f782cf000ccbb8d18fa42d77
      TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.64.0@sha256:1c595f42d794c32c45a6ea8b58655fd66433d4ca3b1bc631c574a48d120bd19f
      CHECKOV_IMAGE: bridgecrew/checkov:3.3.23@sha256:e6e825ba7e2e1e7ea5a831d55dc826a1f7c78edc80ed3ccf30979080843b28a5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: format
        run: docker run --rm -v "$PWD:/work" -w /work "$TERRAFORM_IMAGE" fmt -check -diff -recursive infra
      # no backend and no credentials: this only checks the code, it never reads the state
      # a readonly lock file fails the job when a provider is missing the linux hashes
      - name: validate
        run: |
          for stack in infra/*/; do
            echo "== $stack"
            docker run --rm -v "$PWD:/work" -w "/work/$stack" -e TF_DATA_DIR=/tmp/terraform --entrypoint sh "$TERRAFORM_IMAGE" \
              -c 'terraform init -backend=false -lockfile=readonly -input=false && terraform validate'
          done
      # tflint --init downloads the aws ruleset from github, which rate limits anonymous calls from shared runners
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/work" -w /work --entrypoint sh "$TFLINT_IMAGE"
          -c 'export HOME="$(mktemp -d)" && tflint --init --config=/work/.tflint.hcl && tflint --recursive --chdir=infra --config=/work/.tflint.hcl'
      # --skip-download keeps checkov from calling the prisma cloud api, so it runs offline
      - name: checkov
        run: >-
          docker run --rm --network none -v "$PWD:/work" -w /work "$CHECKOV_IMAGE"
          -d infra --framework terraform --external-checks-dir checkov --quiet --compact --skip-download

  # proves the oidc login; the role only trusts pushes to dev, so pull requests never get aws credentials
  aws:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          role-session-name: ci-${{ github.run_id }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: who am i
        run: aws sts get-caller-identity --query Arn --output text | cut -d/ -f2-

  image:
    needs: [test, secrets, sast, deps, charts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: segp-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t "$IMAGE" app
      # the instrumentation patches libraries at startup and breaks silently when they change
      - name: smoke test metrics
        run: |
          docker run -d --name api -p 127.0.0.1:3000:3000 -p 127.0.0.1:9464:9464 \
            -e PGHOST=127.0.0.1 -e PGDATABASE=smoke -e PGUSER=smoke -e PGPASSWORD=smoke "$IMAGE"
          for _ in $(seq 30); do curl -fs -m 2 http://127.0.0.1:3000/health > /dev/null && break; sleep 1; done
          curl -s -m 10 -o /dev/null http://127.0.0.1:3000/users || true
          curl -fs -m 5 http://127.0.0.1:9464/metrics > metrics.txt || true
          grep 'http_server_request_duration_count{.*http_route="/users"' metrics.txt || {
            docker logs api; cat metrics.txt; exit 1
          }
          docker stop api
      - run: docker save -o image.tar "$IMAGE"
      - name: trivy image vulnerabilities
        run: >-
          docker run --rm -v "$PWD:/work" -w /work -v "$RUNNER_TEMP/trivy:/cache" "$TRIVY_IMAGE"
          image --cache-dir /cache --input image.tar
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --table-mode detailed
      - name: trivy image secrets
        run: >-
          docker run --rm -v "$PWD:/work" -w /work -v "$RUNNER_TEMP/trivy:/cache" "$TRIVY_IMAGE"
          image --cache-dir /cache --input image.tar
          --scanners secret --exit-code 1 --table-mode detailed
      - name: sbom
        run: >-
          docker run --rm -v "$PWD:/work" -w /work -v "$RUNNER_TEMP/trivy:/cache" "$TRIVY_IMAGE"
          image --cache-dir /cache --input image.tar
          --format cyclonedx --output sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
