name: ci

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

env:
  # trivy releases were hijacked in march 2026, so this digest was pinned only after cosign verified
  # it was signed by the aquasecurity/trivy release workflow
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --no-banner --log-opts=HEAD .

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/src" -w /src
          semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
          semgrep scan --config p/default --config p/github-actions --metrics=off --error

  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trivy dependencies
        run: >-
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE"
          fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --table-mode detailed app

  charts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install helm
        run: |
          curl -fsSLo helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum --check
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: lint charts
        run: |
          helm lint charts/api --values environments/staging/api.yaml
          helm lint charts/api --values environments/production/api.yaml
          helm lint charts/postgres
          helm lint charts/baseline --namespace staging --values environments/staging/baseline.yaml
          helm lint charts/baseline --namespace production --values environments/production/baseline.yaml
      - name: render charts
        run: |
          mkdir rendered
          helm template api charts/api --values environments/staging/api.yaml > rendered/api-staging.yaml
          helm template api charts/api --values environments/production/api.yaml > rendered/api-production.yaml
          helm template postgres charts/postgres > rendered/postgres.yaml
          helm template baseline charts/baseline --namespace staging --values environments/staging/baseline.yaml > rendered/baseline-staging.yaml
          helm template baseline charts/baseline --namespace production --values environments/production/baseline.yaml > rendered/baseline-production.yaml
      - name: trivy config
        run: >-
          docker run --rm -v "$PWD:/work" -w /work "$TRIVY_IMAGE"
          config --severity HIGH,CRITICAL --exit-code 1 --table-mode detailed rendered
      # the same policies the cluster enforces, so a violation fails here instead of at deploy time
      # one run per environment: the cli panics when two inputs hold objects with the same name
      # the in-cluster postgres chart is left out: it is for kind only, and the eks environments forbid its image
      - name: kyverno policies
        env:
          KYVERNO_CLI: reg.kyverno.io/kyverno/kyverno-cli:v1.19.1@sha256:ced7b2be0b04250cabfe695f15307f69eb715fe23234816388af4f3812915b2a
        run: |
          helm template baseline charts/baseline --namespace staging --show-only templates/kyverno-policies.yaml > rendered/kyverno-policies.yaml
          for env in staging production; do
            docker run --rm -v "$PWD:/work" -w /work "$KYVERNO_CLI" apply rendered/kyverno-policies.yaml               --resource "rendered/api-$env.yaml" | tee "rendered/kyverno-$env.txt"
            # a policy change that stops matching the rendered resources would otherwise pass with nothing checked
            grep -q 'pass: [1-9]' "rendered/kyverno-$env.txt" || { echo "no kyverno rule was evaluated for $env"; exit 1; }
          done
      # the cluster trusts the copy inside the baseline chart; it must be the key ci signs with
      - name: signing key copy
        run: cmp cosign.pub charts/baseline/files/cosign.pub
      # an alert that never fires is worse than none, so the rules have unit tests like the code
      - name: alert rules
        env:
          # the same prometheus image the cluster runs; it publishes no signature, so it is pinned by digest
          PROMETHEUS_IMAGE: quay.io/prometheus/prometheus:v3.15.0-distroless@sha256:b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
        run: |
          helm template api charts/api --namespace staging --values environments/staging/api.yaml \
            --show-only templates/prometheusrule.yaml | awk '/^spec:/{f=1;next} f{sub(/^  /,"");print}' > rendered/api-rules.yaml
          awk '/^spec:/{f=1;next} f{sub(/^  /,"");print}' falco/manifests/prometheusrule.yaml > rendered/falco-rules.yaml
          for rules in api falco; do
            docker run --rm -v "$PWD:/work" -w /work --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" check rules "rendered/$rules-rules.yaml"
            docker run --rm -v "$PWD:/work" -w /work --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" test rules "tests/alerts/$rules.test.yaml"
          done

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # none of these publish signatures, so they are pinned by digest
      TERRAFORM_IMAGE: hashicorp/terraform:1.16.5@sha256:c7926feace05d0f7e73542842bf3945924e955a1f782cf000ccbb8d18fa42d77
      TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.64.0@sha256:1c595f42d794c32c45a6ea8b58655fd66433d4ca3b1bc631c574a48d120bd19f
      CHECKOV_IMAGE: bridgecrew/checkov:3.3.30@sha256:4b65e89f1fde292249fc0aa0d0db43302c036dfe39f7370b2d3517571082b894
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: format
        run: docker run --rm -v "$PWD:/work" -w /work "$TERRAFORM_IMAGE" fmt -check -diff -recursive infra
      # no backend and no credentials: this only checks the code, it never reads the state
      # a readonly lock file fails the job when a provider is missing the linux hashes
      # modules are validated through the stacks that call them
      - name: validate
        run: |
          for stack in infra/*/; do
            [ -f "$stack/backend.tf" ] || continue
            echo "== $stack"
            docker run --rm -v "$PWD:/work" -w "/work/$stack" -e TF_DATA_DIR=/tmp/terraform --entrypoint sh "$TERRAFORM_IMAGE" \
              -c 'terraform init -backend=false -lockfile=readonly -input=false && terraform validate'
          done
      # tflint --init downloads the aws ruleset from github, which rate limits anonymous calls from shared runners
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/work" -w /work --entrypoint sh "$TFLINT_IMAGE"
          -c 'export HOME="$(mktemp -d)" && tflint --init --config=/work/.tflint.hcl && tflint --recursive --chdir=infra --config=/work/.tflint.hcl'
      # --skip-download keeps checkov from calling the prisma cloud api, so it runs offline
      - name: checkov
        run: >-
          docker run --rm --network none -v "$PWD:/work" -w /work "$CHECKOV_IMAGE"
          -d infra --framework terraform --external-checks-dir checkov --quiet --compact --skip-download

  # production only gets an image that went to staging first: the tag and digest a pull request sets in the
  # production values must have been in the staging values on the target branch at some point
  promotion:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: production image went to staging first
        run: |
          file=environments/production/api.yaml
          if git diff --quiet "origin/$GITHUB_BASE_REF" -- "$file"; then
            echo "$file is unchanged"; exit 0
          fi
          tag=$(sed -n 's/^  tag: "\(.*\)"$/\1/p' "$file")
          digest=$(sed -n 's/^  digest: "\(.*\)"$/\1/p' "$file")
          if [ -z "$tag" ] || [ -z "$digest" ]; then
            echo "$file must pin image.tag and image.digest"; exit 1
          fi
          for commit in $(git log --format=%H "origin/$GITHUB_BASE_REF" -- environments/staging/api.yaml); do
            staging=$(git show "$commit:environments/staging/api.yaml")
            if grep -qxF "  tag: \"$tag\"" <<< "$staging" && grep -qxF "  digest: \"$digest\"" <<< "$staging"; then
              echo "staging got $tag@$digest in $(git log -1 --format='%h on %cs' "$commit")" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "staging never got $tag@$digest, so it can't go to production" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  image:
    needs: [test, secrets, sast, deps, charts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: segp-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t "$IMAGE" app
      # the instrumentation patches libraries at startup and breaks silently when they change
      - name: smoke test metrics
        run: |
          docker run -d --name api -p 127.0.0.1:3000:3000 -p 127.0.0.1:9464:9464 \
            -e PGHOST=127.0.0.1 -e PGDATABASE=smoke -e PGUSER=smoke -e PGPASSWORD=smoke "$IMAGE"
          for _ in $(seq 30); do curl -fs -m 2 http://127.0.0.1:3000/health > /dev/null && break; sleep 1; done
          curl -s -m 10 -o /dev/null http://127.0.0.1:3000/users || true
          curl -fs -m 5 http://127.0.0.1:9464/metrics > metrics.txt || true
          grep 'http_server_request_duration_count{.*http_route="/users"' metrics.txt || {
            docker logs api; cat metrics.txt; exit 1
          }
          docker stop api
      - run: docker save -o image.tar "$IMAGE"
      - name: trivy image vulnerabilities
        run: >-
          docker run --rm -v "$PWD:/work" -w /work -v "$RUNNER_TEMP/trivy:/cache" "$TRIVY_IMAGE"
          image --cache-dir /cache --input image.tar
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --table-mode detailed
      - name: trivy image secrets
        run: >-
          docker run --rm -v "$PWD:/work" -w /work -v "$RUNNER_TEMP/trivy:/cache" "$TRIVY_IMAGE"
          image --cache-dir /cache --input image.tar
          --scanners secret --exit-code 1 --table-mode detailed
      # only pushes publish, and the next job pushes exactly this tarball, so the scanned image is the published one
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ github.sha }}
          path: image.tar
          if-no-files-found: error
          retention-days: 1

  # a separate machine: the build runs code downloaded by npm, so it never shares a job with aws credentials
  # the role only trusts pushes to dev, so pull requests never get them
  publish:
    if: github.event_name == 'push'
    needs: [image, terraform]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      REPOSITORY: segp-api
      # signed by the sigstore project: verified with --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com
      # and --certificate-oidc-issuer https://accounts.google.com
      COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
      # the login step always prints the role id, and aws ids like AROA... encode the account id;
      # github masks every secret a job uses, so this hides it
      ROLE_ID: ${{ secrets.AWS_CI_ROLE_ID }}
    steps:
      # only for cosign.pub, the public key the cluster will trust
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # fails if the tarball does not match the digest recorded at upload
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # a secret, not a variable: step inputs are printed in the log and the arn holds the account id
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          role-session-name: ci-${{ github.run_id }}
          aws-region: us-east-1
          mask-aws-account-id: true
      # an empty or stale secret would mask nothing without anyone noticing
      - name: check the role id is masked
        run: |
          [ "$(aws sts get-caller-identity --query UserId --output text | cut -d: -f1)" = "$ROLE_ID" ] || {
            echo "secret AWS_CI_ROLE_ID does not match the role, so the log shows its id"; exit 1; }
      # the tag is a label for humans; the digest the registry returns is what gets signed and deployed
      - name: push to ecr
        run: |
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker load -i image.tar
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker tag "$REPOSITORY:$GITHUB_SHA" "$registry/$REPOSITORY:$GITHUB_SHA"
          docker push "$registry/$REPOSITORY:$GITHUB_SHA"
          digest=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "pushed $REPOSITORY@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "IMAGE_REF=$registry/$REPOSITORY@$digest" >> "$GITHUB_ENV"
      # generated from the pushed image, so it names the image the cluster will run
      - name: sbom
        run: >-
          docker run --rm -v "$PWD:/work" -w /work -v "$HOME/.docker:/docker:ro" -e DOCKER_CONFIG=/docker "$TRIVY_IMAGE"
          image --image-src remote --format cyclonedx --output sbom.cdx.json "$IMAGE_REF"
      # written by this workflow, not by github, so it only reaches slsa build level 1: whoever edits the workflow can write anything here
      - name: provenance
        run: |
          workflow="${GITHUB_WORKFLOW_REF%@*}"
          jq -n \
            --arg repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg path "${workflow#"$GITHUB_REPOSITORY/"}" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg repo_id "$GITHUB_REPOSITORY_ID" \
            --arg owner_id "$GITHUB_REPOSITORY_OWNER_ID" \
            --arg runner "$RUNNER_ENVIRONMENT" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            '{
              buildDefinition: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: {workflow: {ref: $ref, repository: $repo, path: $path}},
                internalParameters: {github: {event_name: $event, repository_id: $repo_id, repository_owner_id: $owner_id, runner_environment: $runner}},
                resolvedDependencies: [{uri: "git+\($repo)@\($ref)", digest: {gitCommit: $sha}}]
              },
              runDetails: {
                builder: {id: "\($repo)/\($path)@\($ref)"},
                metadata: {invocationId: $run}
              }
            }' > provenance.json
          cat provenance.json
      # no rekor: its public log is permanent and the repository is private; cloudtrail records every kms:Sign instead
      # cosign reads the ecr login that docker saved; kms signs, so the private key never leaves aws
      - name: sign and attest
        run: |
          cosign() {
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work \
              -v "$HOME/.docker:/docker:ro" -e DOCKER_CONFIG=/docker \
              -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN -e AWS_REGION \
              "$COSIGN_IMAGE" "$@"
          }
          cosign signing-config create --out no-services.json
          cosign sign --yes --key awskms:///alias/segp-cosign --signing-config no-services.json "$IMAGE_REF"
          cosign attest --yes --key awskms:///alias/segp-cosign --signing-config no-services.json \
            --type cyclonedx --predicate sbom.cdx.json "$IMAGE_REF"
          cosign attest --yes --key awskms:///alias/segp-cosign --signing-config no-services.json \
            --type slsaprovenance1 --predicate provenance.json "$IMAGE_REF"
      # checks everything against the key in git, the same one the cluster will use
      - name: verify
        run: |
          cosign() {
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work \
              -v "$HOME/.docker:/docker:ro" -e DOCKER_CONFIG=/docker \
              "$COSIGN_IMAGE" "$@" --key cosign.pub --insecure-ignore-tlog=true "$IMAGE_REF" > /dev/null
          }
          # ecr lists a new referrer a few seconds after the push, so a check right after attesting can miss it
          verify() {
            for attempt in 1 2 3; do
              cosign "$@" && return 0
              echo "attempt $attempt failed, ecr may not list the new referrer yet"
              sleep 10
            done
            return 1
          }
          verify verify
          verify verify-attestation --type cyclonedx
          verify verify-attestation --type slsaprovenance1
