apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
    {{- if .Values.metrics.enabled }}
    - from:
        {{- toYaml .Values.metrics.scrapers | nindent 8 }}
      ports:
        - port: metrics
    {{- end }}
  egress:
    - to:
        {{- toYaml .Values.database.networkPeers | nindent 8 }}
      ports:
        - port: {{ .Values.database.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    {{- include "api.labels" . | nindent 4 }}
  annotations:
    # the migration hook runs before regular resources are applied, so its policy has to be a hook too
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-migrate
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- toYaml .Values.database.networkPeers | nindent 8 }}
      ports:
        - port: {{ .Values.database.port }}
