replicaCount: 2

image:
  repository: segp-api
  tag: ""
  pullPolicy: IfNotPresent

database:
  host: postgres
  port: 5432
  name: api
  credentialsSecret: db-credentials
  # where the api may connect on the database port; on EKS this becomes the RDS subnets
  networkPeers:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres

service:
  port: 80

metrics:
  # the opentelemetry exporter in the image listens on this port
  port: 9464
  # adds the service port, the network policy rule and the ServiceMonitor; off where the image has no metrics yet
  enabled: true
  # the only pods allowed to read the metrics port
  scrapers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
  # prometheus only picks up ServiceMonitors with this label
  serviceMonitorLabels:
    release: kube-prometheus-stack

traces:
  # the node-local opentelemetry collector; empty means traces are not exported
  endpoint: http://opentelemetry-collector.monitoring-agents:4318
  port: 4318
  # the only pods the api may send traces to
  collectorPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring-agents
      podSelector:
        matchLabels:
          app.kubernetes.io/name: opentelemetry-collector

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
