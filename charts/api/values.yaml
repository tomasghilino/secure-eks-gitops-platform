replicaCount: 2

image:
  repository: segp-api
  tag: ""
  pullPolicy: IfNotPresent

database:
  host: postgres
  port: 5432
  name: api
  credentialsSecret: db-credentials
  # where the api may connect on the database port; on EKS this becomes the RDS subnets
  networkPeers:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres

service:
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
