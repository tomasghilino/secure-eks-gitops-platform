apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  {{- include "baseline.podPolicySpec" . | nindent 2 }}
  validations:
    - expression: "variables.containers.all(c, image(c.image).containsDigest() || !(image(c.image).tag() in ['', 'latest']))"
      message: every image needs a fixed tag or a digest, never latest or no tag
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-memory-limit
spec:
  {{- include "baseline.podPolicySpec" . | nindent 2 }}
  validations:
    - expression: "variables.containers.all(c, 'memory' in c.?resources.?limits.orValue({}))"
      message: every container needs a memory limit
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: disallow-service-account-token
spec:
  {{- include "baseline.podPolicySpec" . | nindent 2 }}
  validations:
    - expression: "object.spec.?automountServiceAccountToken.orValue(true) == false"
      message: pods must set automountServiceAccountToken to false
---
# only the api image, pinned to a commit and a digest, plus the images listed in values. the api image may name
# any ecr registry here because verify-api-image then demands our signature, so a copy elsewhere is still denied
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: restrict-image-sources
spec:
  {{- include "baseline.podPolicySpec" . | nindent 2 }}
  validations:
    - expression: >-
        variables.containers.all(c, c.image in {{ toJson .Values.allowedImages }} ||
        c.image.matches('{{ include "baseline.apiImagePattern" . }}'))
      message: only the api image pinned to a commit and a digest, or an image listed in the baseline values, may run here
---
# kubectl debug adds containers to a running pod through the ephemeralcontainers subresource, which the pod rules
# above never see; debug containers get the same image rule (they can't set resources, so no memory rule).
# a policy of its own, because a policy that matches a subresource gets no autogen rules for deployments and jobs
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: restrict-debug-container-images
spec:
  validationActions:
    - {{ .Values.kyverno.action }}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [pods/ephemeralcontainers]
  autogen:
    podControllers:
      controllers: []
  # checked when a debug container is added; a subresource can't be listed for background reports
  evaluation:
    background:
      enabled: false
  validations:
    - expression: >-
        object.spec.?ephemeralContainers.orValue([]).all(c, c.image in {{ toJson .Values.allowedImages }} ||
        c.image.matches('{{ include "baseline.apiImagePattern" . }}'))
      message: debug containers may only use the api image pinned to a commit and a digest, or an image listed in the baseline values
