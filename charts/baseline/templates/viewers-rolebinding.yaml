{{- if .Values.viewerGroups }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # built in: read pods, logs and workloads, but not secrets
  name: view
subjects:
  {{- range .Values.viewerGroups }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ . }}
  {{- end }}
{{- end }}
