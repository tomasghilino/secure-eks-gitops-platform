# wraps each dashboard json in a ConfigMap that the grafana sidecar loads
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: SEGP
configMapGenerator:
  - name: dashboard-api
    files:
      - api.json
