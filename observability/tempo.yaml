# installed by argocd/apps/tempo.yaml, which pins the chart version
# one process with traces on a local volume; on EKS this moves to S3
tempo:
  # digest pinned after cosign verified it was signed by a grafana/tempo workflow at tag v3.1.0;
  # the chart has no digest field, so it goes after the tag
  tag: 3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
  reportingEnabled: false
  retention: 48h
  # the chart sets none, which the restricted pod security level rejects
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

persistence:
  enabled: true
  size: 2Gi
