# installed by argocd/apps/kube-prometheus-stack.yaml, which pins the chart version
# images are pinned by digest; cosign verified the four that are signed (operator, config reloader,
# kube-state-metrics, webhook certgen), the others publish no signature

# control plane components can't be scraped on EKS, so they stay out on kind too
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
# the kube-dns service already exposes metrics, so nothing has to be created in kube-system
coreDns:
  service:
    enabled: false
  serviceMonitor:
    selector:
      matchLabels:
        k8s-app: kube-dns
    port: metrics

prometheusOperator:
  image:
    sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
  prometheusConfigReloader:
    image:
      sha: 06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
  admissionWebhooks:
    patch:
      image:
        sha: 58e4ac2e15bf7785eb00ac90d03f9be1ff3f2fe0add6c71b54af6e5c80031148

prometheus:
  prometheusSpec:
    image:
      sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
    retention: 2d

alertmanager:
  alertmanagerSpec:
    image:
      sha: e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a

grafana:
  image:
    sha: 202e5d5b3f8499e70ccac7991eea6d7da72d2790eb2e0597e7987acf724e7180
  sidecar:
    image:
      sha: 2912be006f62f9ea080194cf6d3afcd90daead8d101d0ba686a137a849f6a4f6
  # created by scripts/eks-up.sh, never stored in git
  admin:
    existingSecret: grafana-admin
  # by default the sidecars watch every namespace through a ClusterRole that can read every Secret
  # in the cluster; dashboards and data sources only live in monitoring, so a Role there is enough
  rbac:
    namespaced: true
  sidecar:
    dashboards:
      searchNamespace: null
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring:3100
      jsonData:
        # the request log carries the trace id, so each line links to its trace
        derivedFields:
          - name: traceId
            matcherRegex: '"traceId":"(\w+)"'
            datasourceUid: tempo
            url: $${__value.raw}
            urlDisplayLabel: Open trace
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring:3200
      jsonData:
        # from a span to the logs of the same request
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          tags:
            - key: k8s.namespace.name
              value: k8s_namespace_name
            - key: k8s.deployment.name
              value: k8s_deployment_name
        lokiSearch:
          datasourceUid: loki
        nodeGraph:
          enabled: true
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
  testFramework:
    enabled: false

kube-state-metrics:
  image:
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  # the chart default minus configmaps and secrets: listing them returns their contents, and the
  # metrics about them are not used
  collectors:
    - certificatesigningrequests
    - cronjobs
    - daemonsets
    - deployments
    - endpointslices
    - horizontalpodautoscalers
    - ingresses
    - jobs
    - leases
    - limitranges
    - mutatingwebhookconfigurations
    - namespaces
    - networkpolicies
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - poddisruptionbudgets
    - pods
    - replicasets
    - replicationcontrollers
    - resourcequotas
    - services
    - statefulsets
    - storageclasses
    - validatingwebhookconfigurations
    - volumeattachments

prometheus-node-exporter:
  # needs the host network, pid namespace and filesystem, so it runs apart from the rest
  namespaceOverride: monitoring-agents
  image:
    digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
