# installed by argocd/apps/loki.yaml, which pins the chart version
# one process with its index and chunks on a local volume; on EKS this moves to S3
deploymentMode: Monolithic

loki:
  # the loki image publishes no signature, so it is pinned by digest only
  image:
    tag: 3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
  # a single tenant: every log stream belongs to the same organization
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 48h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    size: 2Gi
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# extras for large installations, not needed for one replica
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
sidecar:
  rules:
    enabled: false
